name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            services/worker/requirements.txt
      - name: Install dependencies
        run: pip install -r services/worker/requirements.txt
      - name: Compile Python
        run: python -m compileall -q services/worker
      - name: Run unit tests
        env:
          PYTHONPATH: services/worker
        run: |
          python -m unittest discover -s services/worker/tests -v

  laravel:
    name: Laravel (${{ matrix.app }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Configure test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
      - name: Validate configuration and migrations
        run: |
          php artisan config:clear
          php artisan route:list
          php artisan migrate --force
      - name: Run tests
        run: php artisan test

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform projects
        run: python3 tool/generate_platforms.py --platforms=android,ios
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t utaone-api:ci .
      - name: Build worker image
        run: docker build -f services/worker/Dockerfile -t utaone-worker:ci .
