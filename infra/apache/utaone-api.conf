<VirtualHost *:80>
    ServerName api.uta.one
    DocumentRoot /var/www/utaone/apps/api/public
    <Directory /var/www/utaone/apps/api/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/utaone-api-error.log
    CustomLog ${APACHE_LOG_DIR}/utaone-api-access.log combined
</VirtualHost>
