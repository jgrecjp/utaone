<VirtualHost *:80>
    ServerName api.uta.one

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/utaone-api-error.log
    CustomLog ${APACHE_LOG_DIR}/utaone-api-access.log combined
</VirtualHost>
