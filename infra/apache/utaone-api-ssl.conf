<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.uta.one

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.uta.one/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.uta.one/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/utaone-api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/utaone-api-ssl-access.log combined
</VirtualHost>
</IfModule>
