<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.uta.one

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.uta.one/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.uta.one/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/utaone/apps/api/public
    <Directory /var/www/utaone/apps/api/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/utaone-api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/utaone-api-ssl-access.log combined
</VirtualHost>
</IfModule>
