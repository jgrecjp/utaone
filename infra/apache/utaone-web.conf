<VirtualHost *:80>
    ServerName uta.one
    DocumentRoot /var/www/utaone/apps/web/public

    <Directory /var/www/utaone/apps/web/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/utaone-web-error.log
    CustomLog ${APACHE_LOG_DIR}/utaone-web-access.log combined
</VirtualHost>
