services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/utaone.sqlite3
      UTAONE_STORAGE_PATH: /data/media
      CACHE_STORE: file
      SESSION_DRIVER: file
    ports:
      - "8000:80"
    volumes:
      - utaone_data:/data

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      UTAONE_ROOT: /app
      UTAONE_DATABASE_PATH: /data/utaone.sqlite3
      UTAONE_STORAGE_PATH: /data/media
    depends_on: [api]
    volumes:
      - utaone_data:/data

volumes:
  utaone_data:
